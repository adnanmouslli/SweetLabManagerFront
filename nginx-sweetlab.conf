# SweetLab Application Configuration
# Add this to your existing anycode-sy.com nginx configuration

# SweetLab subdomain
server {
    server_name sweetlab.anycode-sy.com;

    proxy_connect_timeout 900s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    send_timeout 900s;
    client_body_timeout 900s;
    keepalive_timeout 900s;

    location / {
        proxy_pass http://localhost:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Error logging
    error_log /var/log/nginx/sweetlab.error.log;
    access_log /var/log/nginx/sweetlab.access.log;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/anycode-sy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anycode-sy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = sweetlab.anycode-sy.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name sweetlab.anycode-sy.com;
    return 301 https://$host$request_uri;
}
