version: "3"

services:
  sweet-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sweet-lab
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      # Add any other environment variables your app needs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
